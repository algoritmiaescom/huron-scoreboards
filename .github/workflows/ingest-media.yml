name: Ingest media

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

concurrency:
  group: media-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'schedule' || vars.MEDIA_INGESTION_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      MEDIA_BRANCH: automation/media-ingestion
      HUSKY: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Preserve an existing ingestion PR
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run media:pull-request -- prepare
      - name: Ingest and validate media
        env:
          JUICER_API_KEY: ${{ secrets.JUICER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npm run ingest:media | tee "$RUNNER_TEMP/media-ingestion-summary.txt"
          npm run validate:data
          npx prettier 'data/media/events/*.json' --check
      - name: Publish reviewed data changes
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARISON: ${{ steps.previous.outputs.comparison }}
          PR_NUMBER: ${{ steps.previous.outputs.number }}
        run: npm run media:pull-request -- publish
