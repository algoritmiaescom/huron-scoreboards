name: Standings feasibility benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/standings-spike/**'
      - '.github/workflows/standings-spike.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/standings-spike/**'
      - '.github/workflows/standings-spike.yml'

concurrency:
  group: standings-spike-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NO_CLOUD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install local tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          curl --fail --location --retry 2 --max-time 300 \
            https://github.com/astral-sh/uv/releases/download/0.9.22/uv-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/uv.tar.gz"
          echo 'e170aed70ac0225feee612e855d3a57ae73c61ffb22c7e52c3fd33b87c286508  uv.tar.gz' > "$RUNNER_TEMP/uv.sha256"
          # Checksums are verified before executing downloaded tools.
          (cd "$RUNNER_TEMP" && sha256sum --check uv.sha256)
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Restore locked Python environment
        run: |
          uv sync --locked --project scripts/standings-spike
          uv run --locked --project scripts/standings-spike playwright install --with-deps chromium
      - name: Verify offline integration and failure handling
        run: |
          uv run --locked --project scripts/standings-spike pytest scripts/standings-spike
          uv run --locked --project scripts/standings-spike python \
            scripts/standings-spike/spike.py --offline --output .standings-spike/offline
      - name: Install pinned Ollama
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          curl --fail --location --retry 2 --max-time 600 \
            https://github.com/ollama/ollama/releases/download/v0.13.5/ollama-linux-amd64.tgz \
            -o "$RUNNER_TEMP/ollama.tgz"
          echo '41fb93ff8be35e4d2d22bafd1c42b487efb15b766076d976766bd1ee4db3f8e2  ollama.tgz' > "$RUNNER_TEMP/ollama.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check ollama.sha256)
          mkdir "$RUNNER_TEMP/standings-ollama"
          tar -xzf "$RUNNER_TEMP/ollama.tgz" -C "$RUNNER_TEMP/standings-ollama"
          echo "$RUNNER_TEMP/standings-ollama/bin" >> "$GITHUB_PATH"
          echo "$((SECONDS - started))" > "$RUNNER_TEMP/ollama-install-seconds.txt"
      - name: Test and benchmark
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          OLLAMA_MODELS: ${{ runner.temp }}/standings-models
        run: |
          set -euo pipefail
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          ollama_pid=$!
          trap 'kill "$ollama_pid"; wait "$ollama_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then
              ready=true
              break
            fi
            kill -0 "$ollama_pid"
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Ollama did not become ready' >&2
            exit 1
          fi
          uv run --locked --project scripts/standings-spike python \
            scripts/standings-spike/spike.py --output .standings-spike/hosted
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: standings-feasibility-evidence
          include-hidden-files: true
          path: |
            .standings-spike/offline/
            .standings-spike/hosted/
            ${{ runner.temp }}/ollama-install-seconds.txt
            ${{ runner.temp }}/ollama.log
          retention-days: 7
